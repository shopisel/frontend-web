# fly.toml app configuration file generated for frontend-web-u3bcsw on 2026-07-07T18:39:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'frontend-web-u3bcsw'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    VITE_API_BASE_URL = '/api'
    VITE_KEYCLOAK_CLIENT_ID = 'shopisel-web'
    VITE_KEYCLOAK_REALM = 'shopisel'
    VITE_KEYCLOAK_URL = 'https://shopisel-keycloak-fly.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
